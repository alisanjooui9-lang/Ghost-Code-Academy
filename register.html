<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Ghost Code | ثبت نام</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#000;
    color:#fff;
    font-family:Tahoma,Arial,sans-serif;
}

@keyframes rgb{

    0%{
        background-position:0% 50%;
    }

    50%{
        background-position:100% 50%;
    }

    100%{
        background-position:0% 50%;
    }

}

header{

    height:70px;

    background:#080808;

    border-bottom:1px solid #222;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 20px;

}

.logo{

    font-size:21px;

    font-weight:bold;

    font-family:Arial;

}

.logo span{

    background:linear-gradient(
        90deg,
        red,
        #ff00ff,
        blue,
        cyan,
        lime,
        yellow,
        red
    );

    background-size:400%;

    animation:rgb 4s linear infinite;

    -webkit-background-clip:text;

    background-clip:text;

    color:transparent;

}

.back{

    color:#aaa;

    text-decoration:none;

    font-size:10px;

}

.container{

    max-width:500px;

    margin:auto;

    padding:40px 15px;

}

.card{

    position:relative;

    background:#090909;

    border:1px solid #292929;

    border-radius:18px;

    padding:25px;

    overflow:hidden;

}

.card:before{

    content:"";

    position:absolute;

    top:0;

    right:0;

    width:100%;

    height:3px;

    background:linear-gradient(
        90deg,
        red,
        #ff00ff,
        blue,
        cyan,
        lime,
        yellow,
        red
    );

    background-size:400%;

    animation:rgb 3s linear infinite;

}

h1{

    text-align:center;

    font-family:Arial;

    font-size:27px;

    margin:5px 0 8px;

}

.subtitle{

    text-align:center;

    color:#666;

    font-size:9px;

    margin-bottom:30px;

}

label{

    display:block;

    color:#aaa;

    font-size:10px;

    margin-bottom:7px;

}

input{

    width:100%;

    padding:14px;

    margin-bottom:17px;

    background:#111;

    color:#fff;

    border:1px solid #292929;

    border-radius:10px;

    outline:none;

}

input:focus{

    border-color:#00ffff;

}

button{

    width:100%;

    padding:14px;

    border:0;

    border-radius:10px;

    color:#fff;

    font-weight:bold;

    cursor:pointer;

    background:linear-gradient(
        90deg,
        red,
        #ff00ff,
        blue,
        cyan,
        lime,
        yellow
    );

    background-size:300%;

    animation:rgb 4s linear infinite;

}

button:disabled{

    opacity:.5;

    cursor:not-allowed;

}

.message{

    display:none;

    margin-top:18px;

    padding:14px;

    border-radius:10px;

    font-size:9px;

    line-height:2;

}

.error{

    background:#180707;

    border:1px solid #5b2222;

    color:#ff8585;

}

.success{

    background:#071207;

    border:1px solid #285528;

    color:#9cff9c;

}

.login{

    text-align:center;

    margin-top:20px;

    color:#666;

    font-size:9px;

}

.login a{

    color:#00ffff;

    text-decoration:none;

}

</style>

</head>

<body>


<header>

<div class="logo">

👻 <span>GHOST CODE</span>

</div>

<a href="فهرست.html" class="back">

← بازگشت

</a>

</header>


<div class="container">

<div class="card">


<h1>

ساخت حساب

</h1>


<div class="subtitle">

GHOST CODE • ACADEMY

</div>


<form id="registerForm">


<label>

نام و نام خانوادگی

</label>


<input

id="fullName"

type="text"

maxlength="60"

required

autocomplete="name"

placeholder="نام خود را وارد کنید">


<label>

ایمیل

</label>


<input

id="email"

type="email"

required

autocomplete="email"

placeholder="example@gmail.com">


<label>

رمز عبور

</label>


<input

id="password"

type="password"

minlength="6"

required

autocomplete="new-password"

placeholder="حداقل ۶ کاراکتر">


<label>

تکرار رمز عبور

</label>


<input

id="confirmPassword"

type="password"

minlength="6"

required

autocomplete="new-password"

placeholder="رمز عبور را دوباره وارد کنید">


<button

id="registerButton"

type="submit">

🚀 ساخت حساب

</button>


</form>


<div

id="message"

class="message">

</div>


<div class="login">

حساب دارید؟

<a href="ورود.html">

ورود به حساب

</a>

</div>


</div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =========================
   GHOST CODE SUPABASE
========================= */

const SUPABASE_URL =
"https://essyqqpfjdjchtihgmgh.supabase.co";

const SUPABASE_KEY =
"sb_publishable_aofMM0RYuApBZQRiqakofg_rhTwFfqZ";


const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================
   ELEMENTS
========================= */

const form =
document.getElementById(
    "registerForm"
);

const button =
document.getElementById(
    "registerButton"
);

const message =
document.getElementById(
    "message"
);


/* =========================
   MESSAGE
========================= */

function showMessage(
    text,
    type
){

    message.textContent =
    text;

    message.className =
    "message " + type;

    message.style.display =
    "block";

}


/* =========================
   REGISTER
========================= */

form.addEventListener(
"submit",
async function(event){

    event.preventDefault();


    const fullName =
    document.getElementById(
        "fullName"
    ).value.trim();


    const email =
    document.getElementById(
        "email"
    ).value.trim();


    const password =
    document.getElementById(
        "password"
    ).value;


    const confirmPassword =
    document.getElementById(
        "confirmPassword"
    ).value;


    message.style.display =
    "none";


    /* CHECK NAME */

    if(!fullName){

        showMessage(
            "لطفاً نام و نام خانوادگی را وارد کنید.",
            "error"
        );

        return;

    }


    /* CHECK PASSWORD */

    if(password.length < 6){

        showMessage(
            "رمز عبور باید حداقل ۶ کاراکتر باشد.",
            "error"
        );

        return;

    }


    /* CHECK CONFIRM PASSWORD */

    if(password !== confirmPassword){

        showMessage(
            "رمزهای عبور یکسان نیستند.",
            "error"
        );

        return;

    }


    button.disabled =
    true;

    button.textContent =
    "در حال ساخت حساب...";


    try{


        /* =====================
           CREATE AUTH USER
        ===================== */

        const {
            data,
            error
        } =
        await supabaseClient.auth.signUp({

            email:email,

            password:password

        });


        if(error){

            throw error;

        }


        if(!data.user){

            throw new Error(
                "کاربر ساخته نشد."
            );

        }


        /* =====================
           CREATE PROFILE
        ===================== */

        const {
            error:profileError
        } =
        await supabaseClient
        .from("profiles")
        .insert({

            id:data.user.id,

            full_name:fullName,

            xp:0,

            level:1,

            completed_lessons:0

        });


        if(profileError){

            throw profileError;

        }


        /* =====================
           SUCCESS
        ===================== */

        showMessage(
            "✅ حساب شما با موفقیت ساخته شد!",
            "success"
        );


        button.textContent =
        "✅ ثبت نام موفق";


        form.reset();


    }catch(error){


        console.error(
            "Ghost Code:",
            error
        );


        showMessage(
            "خطا: " +
            (
                error.message ||
                "ثبت نام انجام نشد."
            ),
            "error"
        );


        button.disabled =
        false;


        button.textContent =
        "🚀 ساخت حساب";

    }

});

</script>


</body>

</html>
